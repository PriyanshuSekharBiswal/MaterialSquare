# Paid production resources. Review the provider's price before creating this blueprint.
services:
  - type: web
    name: material-square-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build --workspace=@material-square/types && npm run build:api && npm prune --omit=dev && node scripts/verify-runtime-deps.cjs
    preDeployCommand: npm run db:deploy
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DEMO_AUTH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: material-square-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: MSG91_AUTHKEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_ENDPOINT
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_PUBLIC_URL
        sync: false
databases:
  - name: material-square-db
    plan: basic-1gb
    databaseName: material_square
    user: material_square
    ipAllowList: []
