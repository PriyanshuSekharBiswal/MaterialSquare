# Paid production resources. Review the provider's price before creating this blueprint.
services:
  - type: web
    name: material-square-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:generate && npm run build --workspace=@material-square/types && npm run build:api
    preDeployCommand: npm run db:deploy
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DEMO_AUTH_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: material-square-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: OTP_WEBHOOK_URL
        sync: false
      - key: OTP_WEBHOOK_TOKEN
        sync: false
      - key: TWOFACTOR_API_KEY
        sync: false
databases:
  - name: material-square-db
    plan: basic-1gb
    databaseName: material_square
    user: material_square
    ipAllowList: []
