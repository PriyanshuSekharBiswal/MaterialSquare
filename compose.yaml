services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: material_square_dev
      POSTGRES_USER: material_square
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U material_square -d material_square_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
  storage:
    image: adobe/s3mock:5.2.2
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${AWS_S3_BUCKET:-material-square-assets}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9000:9090"
      - "127.0.0.1:9001:9191"
    volumes:
      - s3mock_data:/s3mockroot
volumes:
  postgres_data_v18:
  redis_data:
  s3mock_data:
