name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: material_square
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: material_square_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U material_square -d material_square_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://material_square:test-only-password@localhost:5432/material_square_test
      TEST_DATABASE_URL: postgresql://material_square:test-only-password@localhost:5432/material_square_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            demo-test-results/
