# Run with --env-file .env.production -f compose.production.yaml
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: material_square
      POSTGRES_USER: material_square
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - production_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U material_square -d material_square"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"
        case "$$REDIS_PASSWORD" in ''|*[!a-fA-F0-9]*) echo "Redis password must contain only hexadecimal characters" >&2; exit 1 ;; esac
        umask 077
        printf 'appendonly yes\nrequirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    volumes:
      - production_redis:/data
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PRODUCTION_API_CONTAINER: "true"
      PORT: 4000
      DATABASE_URL: postgresql://material_square:${POSTGRES_PASSWORD:?Set database password}@postgres:5432/material_square
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_SECRET: ${JWT_SECRET:?Set a random secret of at least 32 characters}
      MSG91_AUTHKEY: ${MSG91_AUTHKEY:?Set the MSG91 server auth key}
      MSG91_SMS_TEMPLATE_ID_QUOTE_PUBLISHED: ${MSG91_SMS_TEMPLATE_ID_QUOTE_PUBLISHED:-}
      MSG91_SMS_TEMPLATE_ID_QUOTE_EXPIRY_REMINDER: ${MSG91_SMS_TEMPLATE_ID_QUOTE_EXPIRY_REMINDER:-}
      MSG91_SMS_TEMPLATE_ID_QUOTE_FOLLOW_UP: ${MSG91_SMS_TEMPLATE_ID_QUOTE_FOLLOW_UP:-}
      MSG91_SMS_TEMPLATE_ID_DISPATCH_UPDATE: ${MSG91_SMS_TEMPLATE_ID_DISPATCH_UPDATE:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_TOKEN: ${NOTIFICATION_WEBHOOK_TOKEN:-}
      CORS_ORIGINS: https://${SITE_DOMAIN:?Set website domain}
      TRUST_PROXY_HOPS: 1
      ENABLE_API_DOCS: "false"
      QUOTE_SELLER_NAME: Material Square
      AWS_REGION: ${AWS_REGION:?Set storage region}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?Set storage bucket}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set storage access key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set storage secret key}
      AWS_S3_PUBLIC_URL: ${AWS_S3_PUBLIC_URL:?Set public storage URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  gateway:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      target: gateway
      args:
        VITE_MSG91_WIDGET_ID: ${VITE_MSG91_WIDGET_ID:?Set customer MSG91 widget ID}
        VITE_MSG91_TOKEN_AUTH: ${VITE_MSG91_TOKEN_AUTH:?Set customer MSG91 token auth value}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set website domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - tls_data:/data
      - tls_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  production_database:
  production_redis:
  tls_data:
  tls_config:
secrets:
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?Set the path to the Redis password file}
